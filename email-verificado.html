<!DOCTYPE html>
<html lang="pt-BR" data-theme="0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>E-mail confirmado — Chaos</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d1e14;--surface:#142010;--surf2:#1c2e18;--border:rgba(80,160,80,.22);--text:#d8f0d0;--muted:#80b878;--faint:#55784d;--e:#5aa84a;--el:#0e1e0a;--eb:#284820;--err:#d05050;--errl:#1a0808;--errb:#a03030}
    body{min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(90,168,74,.16),transparent 34%),var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(92vw,460px);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px 28px;box-shadow:0 24px 80px rgba(0,0,0,.32);text-align:center}
    .brand{font-family:Georgia,serif;font-size:24px;color:var(--e);margin-bottom:6px}
    .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:26px}
    .icon{width:54px;height:54px;border-radius:16px;background:var(--el);border:1px solid var(--eb);display:grid;place-items:center;margin:0 auto 18px;color:var(--e);font-size:25px}
    h1{font-family:Georgia,serif;font-size:27px;font-weight:400;line-height:1.15;margin-bottom:12px}
    p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 auto 20px;max-width:360px}
    .msg{border:1px solid var(--border);background:var(--surf2);border-radius:12px;padding:12px 14px;margin:18px 0 20px;color:var(--text);font-size:13px;line-height:1.55}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:10px 18px;border-radius:999px;border:1px solid var(--e);background:var(--e);color:#fff;text-decoration:none;font-size:13px;font-weight:600;transition:transform .15s,opacity .15s}
    .btn:hover{transform:translateY(-1px);opacity:.9}
    .small{margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);line-height:1.5}
    .error .icon{background:var(--errl);border-color:var(--errb);color:var(--err)}
    .error .btn{background:transparent;border-color:var(--errb);color:var(--err)}
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="brand">Chaos</div>
    <div class="sub">Arquitetura e Urbanismo</div>
    <div class="icon" id="icon">✓</div>
    <h1 id="title">E-mail confirmado</h1>
    <p id="lead">Sua conta foi verificada com sucesso.</p>
    <div class="msg" id="message">Retorne ao site e entre usando seu e-mail e sua senha.</div>
    <a class="btn" id="login-link" href="index.html">Voltar para o login</a>
    <div class="small">Depois de entrar, o acesso ainda pode depender da aprovação da equipe.</div>
  </main>
  <script>
    (function(){
      const rawHash = window.location.hash || '';
      const rawSearch = window.location.search || '';
      const params = new URLSearchParams(rawSearch);
      const hashParams = new URLSearchParams(rawHash.replace(/^#/, ''));
      const error = params.get('error') || hashParams.get('error');
      const errorDescription = params.get('error_description') || hashParams.get('error_description');
      const login = document.getElementById('login-link');
      login.href = new URL('index.html', window.location.href).toString();
      if(error || errorDescription){
        document.getElementById('card').classList.add('error');
        document.getElementById('icon').textContent = '!';
        document.getElementById('title').textContent = 'Link não confirmado';
        document.getElementById('lead').textContent = 'O link pode ter expirado ou já ter sido usado.';
        document.getElementById('message').textContent = 'Volte ao site e tente entrar. Se não liberar, crie a conta novamente ou peça um novo e-mail de confirmação.';
      }
      // Remove tokens/códigos da barra de endereço para evitar confusão visual.
      if(rawHash || rawSearch){
        history.replaceState(null, document.title, window.location.pathname);
      }
    })();
  </script>
</body>
</html>
