# Atualiza o índice próprio da Mapoteca (mapoteca-indice.json).
# Caminho no GitHub: .github/workflows/indice-mapoteca.yml
# Roda todo dia de madrugada. Cada rodada lê até ~80 min de pranchas, salva o que leu
# e a próxima continua de onde parou. Quando tudo já foi lido, a rodada leva 1–2 min
# (só confere se a prefeitura publicou prancha nova).
name: Atualizar índice da Mapoteca

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Campo Grande
  workflow_dispatch:        # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: indice-mapoteca
  cancel-in-progress: false

jobs:
  indice:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar leitor de PDF
        run: pip install pypdf

      - name: Gerar índice (lista + leitura das pranchas)
        continue-on-error: true
        timeout-minutes: 95
        run: python gerar_indice_mapoteca.py --minutos 80

      - name: Salvar o que foi lido
        if: always()
        run: |
          if git diff --quiet -- mapoteca-indice.json; then
            echo "Índice sem mudanças."
          else
            git config user.name "chaos-bot"
            git config user.email "chaos-bot@users.noreply.github.com"
            git add mapoteca-indice.json
            git commit -m "Mapoteca: índice atualizado"
            git pull --rebase
            git push
          fi
