<script>
/* tema inicial: o que o sistema mandar no endereço (?tema=N) ou o último tema salvo */
(function(){
  var d = document.documentElement, t = null, m = /[?&]tema=(\d{1,2})(&|$)/.exec(location.search);
  if (m) t = m[1];
  if (t === null){ try { t = localStorage.getItem('chaos-theme'); } catch (e) {} }
  d.setAttribute('data-theme', /^\d{1,2}$/.test(String(t)) ? String(t) : '10');
  if (window.parent !== window){ d.classList.add('embutido'); try { window.parent.postMessage({ tipo:'chaos-mapa-pronto' }, '*'); } catch (e) {} }
})();
</script>

[data-theme="3"],[data-theme="5"],[data-theme="8"],[data-theme="9"]{color-scheme:dark}
:root{--destaque:#e1222e;--sombra:0 4px 18px rgba(0,0,0,.22)}
/* impressão: sempre papel claro, seja qual for o tema */
html.imp{--bg:#fff;--surface:#fff;--surf2:#f4f1ea;--border:rgba(0,0,0,.14);--border-em:rgba(0,0,0,.28);--text:#1E1D1A;--muted:#5D5747;--faint:#8a8272;
  --e:var(--acento-papel,#8A6A30);--icon-accent:var(--acento-papel,#8A6A30);--el:#f6f1e6;--eb:#c8a26e;--on-e:#fff;--green:#3B6D11;--greenl:#EAF3DE;color-scheme:light!important}
*{box-sizing:border-box;scrollbar-color:var(--border-em) transparent;scrollbar-width:thin}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--font-body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:0;background:var(--surf2)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--icon-accent)}
.cartao,.panel{background:var(--surface);border-radius:14px;box-shadow:var(--sombra)}
.top{position:absolute;z-index:1000;top:12px;left:12px;width:min(540px,calc(100vw - 24px))}
.brand{display:flex;align-items:baseline;gap:9px;padding:8px 14px;background:var(--text);color:var(--bg);border-radius:14px 14px 0 0}
.brand b{font-family:var(--font-display);font-weight:500;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand span{font-size:12px;opacity:.82}
html.embutido .brand{display:none}
.busca{display:flex;gap:6px;padding:8px}
.cp{flex:1;min-width:0;border:1px solid var(--border-em);border-radius:8px;padding:8px 10px;outline:none;background:var(--surface);color:var(--text)}
.cp::placeholder{color:var(--faint)}
.cp:focus{border-color:var(--e)}
.b{border:0;border-radius:8px;padding:8px 12px;background:var(--e);color:var(--on-e);font-weight:600;cursor:pointer;white-space:nowrap}
.b:hover{opacity:.86}
.b.sec{background:var(--surf2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-em)}
.b.sec:hover{background:var(--el);opacity:1}
.ql{display:flex;gap:6px;padding:0 8px 8px;flex-wrap:wrap}
.ql .cp{flex:1 1 90px}
.ql .cp:first-child{flex:2 1 190px}
.lista{max-height:46vh;overflow:auto;border-top:1px solid var(--border)}
.item{padding:8px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.item:hover{background:var(--el)}
.item b{display:block}
.item small{color:var(--muted)}
.item .rm{float:right;cursor:pointer;font-size:18px;line-height:1;text-decoration:none;color:var(--muted);padding:0 2px}
.cab{padding:6px 14px;font-size:12px;color:var(--muted);background:var(--surf2);display:flex;justify-content:space-between;gap:10px}
.cab a{cursor:pointer;white-space:nowrap}
#tools{position:absolute;z-index:1000;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:2px;padding:6px;background:var(--text);border-radius:14px;box-shadow:var(--sombra);max-width:calc(100vw - 16px);overflow-x:auto}
#tools button{display:flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:8px 10px;background:transparent;color:var(--bg);cursor:pointer;font-weight:600;white-space:nowrap}
#tools button:hover{background:color-mix(in srgb,var(--bg) 16%,transparent)}
#tools button.ativo{background:var(--bg);color:var(--text)}
#tools svg{width:18px;height:18px;flex:none}
.panel{position:absolute;z-index:1000;overflow:auto}
.panel.esq{left:12px;bottom:72px;width:340px;max-width:calc(100vw - 24px);max-height:calc(100vh - 200px)}
.panel.dir{right:12px;top:12px;width:min(420px,calc(100vw - 24px));max-height:calc(100vh - 92px)}
.panel h2{margin:0;padding:10px 14px;font-size:14px;font-weight:600;background:var(--text);color:var(--bg);position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;z-index:2}
.panel h2 a{color:var(--bg);cursor:pointer;font-weight:400;font-size:18px;line-height:1;text-decoration:none}
.pc{padding:10px 14px}
.pc .cp{width:100%;margin:0 0 8px}
.pc textarea.cp{min-height:60px;resize:vertical;display:block}
.pc ul{margin:0 0 8px;padding-left:18px}
.pc li{margin:0 0 4px}
.lin{display:flex;gap:10px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 8px}
.grade button{border:1px solid var(--border-em);background:var(--surface);border-radius:8px;padding:7px 4px;cursor:pointer;font-weight:600;color:var(--text)}
.grade button:hover{background:var(--el)}
.grade button.ativo{background:var(--e);border-color:var(--e);color:var(--on-e)}
.filtro{padding:8px 14px;border-bottom:1px solid var(--border);position:sticky;top:38px;background:var(--surface);z-index:1}
.filtro .cp{width:100%}
.gt{padding:6px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--icon-accent);background:var(--surf2);font-weight:700}
.cam{padding:7px 14px;border-bottom:1px solid var(--border)}
.cam label{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--e)}
.cam small{display:block;color:var(--muted);margin-left:24px}
.cam .op{display:none;gap:10px;align-items:center;margin:4px 0 0 24px}
.cam.on .op{display:flex}
.cam input[type=range]{flex:1}
.cam .op a{cursor:pointer;font-size:12px}
.cam img{display:block;margin:6px 0 0 24px;max-width:260px;background:#fff;border-radius:4px}
.base{display:block;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.base input{margin-right:8px}
.fc{padding:12px 14px}
.end{font-size:16px;font-weight:700;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 10px}
.fc table{width:100%;border-collapse:collapse;margin:0 0 10px}
.fc th,.fc td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.fc th{width:42%;color:var(--muted);font-weight:500}
.fc h3,.pc h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--icon-accent)}
.un th{width:auto!important;font-size:12px}
.un td{font-size:12px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.nota{font-size:11px;color:var(--muted);margin:8px 0 0}
.aviso{background:var(--el);border-left:3px solid var(--e);padding:6px 8px;border-radius:4px;margin:0 0 8px;font-size:12.5px}
.zona{margin:0 0 8px}
.zona b{display:inline-block;background:var(--text);color:var(--bg);border-radius:6px;padding:1px 8px;margin-right:6px}
.chips{margin:0 0 6px}
.chips span{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;margin:0 4px 4px 0;background:var(--greenl);color:var(--green)}
.chips span.nao{background:var(--surf2);color:var(--faint);text-decoration:line-through}
.lados{display:flex;flex-wrap:wrap;gap:4px}
.lados span{background:var(--el);border-radius:6px;padding:2px 7px;font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.25)}
#toast{position:absolute;z-index:1100;left:50%;top:14px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:80vw;text-align:center}
#medinfo{position:absolute;z-index:1000;left:50%;bottom:72px;transform:translateX(-50%);background:var(--surface);color:var(--text);border:2px solid #0aa3e6;padding:6px 12px;border-radius:10px;font-weight:600;white-space:nowrap;cursor:pointer}
#barra{position:absolute;z-index:1150;left:50%;top:116px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--text);border:2px solid var(--e);border-radius:12px;padding:8px 12px;box-shadow:var(--sombra);max-width:min(780px,92vw)}
#barra span{font-weight:600}
#barra a{cursor:pointer;font-size:18px;line-height:1;text-decoration:none;color:var(--muted)}
button:disabled{opacity:.55;cursor:default}
#coord{position:absolute;z-index:900;left:12px;bottom:6px;font-size:11px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.cota{pointer-events:none}
.semcota .cota{display:none}
.cota span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(255,255,255,.92);border:1px solid var(--destaque);border-radius:5px;padding:0 4px;font-size:11px;font-weight:700;color:#1E1D1A}
#cmpbar{position:absolute;z-index:900;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6);cursor:ew-resize;touch-action:none}
#cmpbar span{position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;border:2px solid #1E1D1A;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#cmpbar span:before{content:"\2194";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#1E1D1A}
body.comficha .leaflet-bottom.leaflet-right .leaflet-control-zoom,body.comficha .leaflet-bottom.leaflet-right .ctl,body.comficha .leaflet-bottom.leaflet-right .leaflet-control-scale{right:432px;bottom:46px}
.ctl a{display:flex!important;align-items:center;justify-content:center;color:var(--text)!important}
.ctl svg{width:16px;height:16px}
.inf{margin:0 0 8px}
.inf b{color:var(--text)}
.inf table{width:100%;border-collapse:collapse}
.inf td,.inf th{font-size:12px;padding:2px 4px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
.inf th{color:var(--muted);font-weight:500;white-space:nowrap}
.leaflet-container{font:inherit}
/* controles do mapa na paleta do tema */
.leaflet-bar{border-color:var(--border-em)!important}
.leaflet-bar a,.leaflet-bar a:hover,.leaflet-bar a.leaflet-disabled{background:var(--surface);color:var(--text);border-bottom-color:var(--border-em)}
.leaflet-bar a:hover{background:var(--surf2)}
.leaflet-bar a.leaflet-disabled{color:var(--faint)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--text)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-container .leaflet-control-attribution{background:rgba(var(--bg-rgb),.82);color:var(--muted)}
.leaflet-container .leaflet-control-attribution a{color:var(--muted)}
#phead,#pleg{display:none}
html.imp,html.imp body{height:auto}
body.imp{background:#fff;overflow:visible;font-size:11.5px;line-height:1.36}
body.imp .fc{padding:6px 12px}
body.imp .fc th,body.imp .fc td{padding:2px 6px}
body.imp .fc h3{margin:8px 0 3px}
body.imp .fc table{margin:0 0 5px}
body.imp .end{font-size:14px}
body.imp .sub{margin:0 0 5px}
body.imp .leaflet-control-scale{right:0!important;bottom:0!important}
body.imp .top,body.imp #tools,body.imp .panel.esq,body.imp #toast,body.imp #barra,body.imp #coord,body.imp #medinfo,body.imp #cmpbar,body.imp .noprint,body.imp .leaflet-control-zoom,body.imp .ctl{display:none!important}
body.imp-ficha{--pw:190mm;--ph:82mm}
body.imp-mapa{--pw:277mm;--ph:138mm}
body.imp #phead{display:flex;justify-content:space-between;align-items:center;gap:12px;width:var(--pw);margin:0 auto;border-bottom:2px solid var(--icon-accent);padding:0 0 2mm}
#phead img{height:11mm;width:auto;max-width:40mm;object-fit:contain;flex:none}
#phead span{flex:1;font-weight:700;font-size:15px}
#phead small{color:var(--muted)}
body.imp #map{position:relative;inset:auto;width:var(--pw);height:var(--ph);margin:3mm auto 0;border:1px solid #999}
body.imp-ficha #ficha{position:static;width:var(--pw);max-height:none;margin:3mm auto 0;box-shadow:none;overflow:visible;border:1px solid var(--border-em)}
body.imp-ficha #ficha h2{position:static}

var raiz = document.documentElement, logoImg = null;
function hexRgb(v){
  v = String(v == null ? '' : v).trim();
  var m = /^#([0-9a-f]{3})$/i.exec(v);
  if (m) v = '#' + m[1].charAt(0) + m[1].charAt(0) + m[1].charAt(1) + m[1].charAt(1) + m[1].charAt(2) + m[1].charAt(2);
  m = /^#([0-9a-f]{6})$/i.exec(v);
  if (!m) return null;
  var n = parseInt(m[1], 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function rgbHex(c){ return '#' + c.map(function(v){ return ('0' + Math.round(Math.max(0, Math.min(255, v))).toString(16)).slice(-2); }).join(''); }
function lumin(c){
  var a = c.map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
}
function paraPapel(cor, minimo, reserva){ /* escurece a cor do tema até ela ter contraste suficiente sobre papel branco */
  var c = hexRgb(cor) || hexRgb(reserva);
  for (var i = 0; i < 14 && 1.05 / (lumin(c) + 0.05) < minimo; i++) c = c.map(function(v){ return v * 0.85; });
  return rgbHex(c);
}
function varTema(n){ return (getComputedStyle(raiz).getPropertyValue(n) || '').trim(); }
function paleta(){ /* cores do tema, ajustadas para a folha da planta */
  return {
    tinta: paraPapel(varTema('--text'), 12, '#1E1D1A'),
    suave: paraPapel(varTema('--muted'), 4.5, '#5D5747'),
    acento: paraPapel(varTema('--icon-accent') || varTema('--e'), 3.6, '#8A6A30'),
    linha: '#d8d2c4'
  };
}
function aplicaTema(){
  var bg = hexRgb(varTema('--bg'));
  raiz.style.colorScheme = bg && lumin(bg) < 0.2 ? 'dark' : 'light';
  raiz.style.setProperty('--acento-papel', paleta().acento);
}
function logoOk(){ return !!(logoImg && logoImg.complete && logoImg.naturalWidth > 0 && logoImg.naturalHeight > 0); }
function carregaLogo(){
  var im = new Image();
  im.onerror = function(){ if (MARCA.logo !== LOGO_PADRAO){ MARCA.logo = LOGO_PADRAO; MARCA.proprio = false; carregaLogo(); } };
  im.src = MARCA.logo;
  logoImg = im;
  var el = document.getElementById('plogo');
  if (el) el.src = MARCA.logo;
}
window.addEventListener('message', function(ev){
  if (window.parent === window || ev.source !== window.parent) return;
  var m = ev.data;
  if (m && m.tipo === 'chaos-aviso'){ toast(String(m.msg == null ? '' : m.msg).slice(0, 300), 8000); return; }
  if (!m || m.tipo !== 'chaos-tema') return;
  if (m.tema != null && /^\d{1,2}$/.test(String(m.tema))) raiz.setAttribute('data-theme', String(m.tema));
  if (m.vars && typeof m.vars === 'object'){
    var css = '';
    Object.keys(m.vars).forEach(function(k){
      var v = String(m.vars[k]);
      if (/^--[a-z0-9-]+$/.test(k) && v.length < 200 && !/[;{}<>]|url\(/i.test(v)) css += k + ':' + v + ';';
    });
    var st = document.getElementById('temapai');
    if (!st){ st = document.createElement('style'); st.id = 'temapai'; document.head.appendChild(st); }
    st.textContent = ':root{' + css + '}';
  }
  if (m.marca && typeof m.marca === 'object'){
    var lg = String(m.marca.logo || '');
    if (/^data:image\/(png|jpe?g|svg\+xml|webp|gif)[;,]/i.test(lg) && lg.length < 1500000){ MARCA.logo = lg; MARCA.proprio = true; }
    else { MARCA.logo = LOGO_PADRAO; MARCA.proprio = false; }
    MARCA.nome = String(m.marca.nome || '').slice(0, 80) || 'Chaos Arq & Art';
    carregaLogo();
  }
  aplicaTema();
});

function copiar(){
  var p = atual.f.properties, i0 = atual.imoveis[0] || {}, m = atual.med, c = atual.centro, u = utm(c.lat, c.lng), t = ['Lote ' + p.cod_lote];

  t.push('Área do terreno (cadastro): ' + num(p.area_terreno) + ' m²');

  t.push('Área do desenho: ' + num(m.area) + ' m² | Perímetro: ' + num(m.per) + ' m');
  t.push('Coordenadas: ' + c.lat.toFixed(6) + ', ' + c.lng.toFixed(6) + ' | UTM 21S: E ' + num(u[0]) + ' N ' + num(u[1]));

function baixarDxf(){
  var L0 = [], cod = atual.cod, lote = atual;
  function par(c, v){ L0.push(String(c)); L0.push(String(v)); }
  function poli(anel, cam, cor){
    par(0, 'POLYLINE'); par(8, cam); par(62, cor); par(66, 1); par(70, 1);
    for (var i = 0; i < anel.length - 1; i++){ var u = utm(anel[i][1], anel[i][0]); par(0, 'VERTEX'); par(8, cam); par(10, u[0].toFixed(3)); par(20, u[1].toFixed(3)); par(30, '0.0'); }
    par(0, 'SEQEND'); par(8, cam);
  }
  function texto(lon, lat, alt, s, cam, cor){
    var u = utm(lat, lon);
    par(0, 'TEXT'); par(8, cam); par(62, cor); par(10, u[0].toFixed(3)); par(20, u[1].toFixed(3)); par(30, '0.0'); par(40, alt); par(1, ascii(s));
  }
  function monta(viz){
    viz.forEach(function(f){
      var an = aneis(f.geometry);
      if (!an.length || (f.properties && f.properties.cod_lote === cod)) return;
      an.forEach(function(r){ poli(r, 'VIZINHOS', 8); });
      var c = pontoInterno(an[0]);
      texto(c[0], c[1], 0.6, f.properties.cod_lote, 'VIZINHOS_TEXTO', 8);
    });
    lote.an.forEach(function(r){
      poli(r, 'LOTE', 30);
      medidas(r).lados.forEach(function(l){ if (l.d >= 1) texto(l.meio[1], l.meio[0], 0.5, l.d.toFixed(2), 'COTAS', 7); });
    });
    texto(lote.pi[0], lote.pi[1], 1.2, 'LOTE ' + cod, 'LOTE_TEXTO', 7);
    baixar('LOTE ' + cod + ' - UTM SIRGAS2000 21S.dxf', '0\r\nSECTION\r\n2\r\nENTITIES\r\n' + L0.join('\r\n') + '\r\n0\r\nENDSEC\r\n0\r\nEOF\r\n', 'application/dxf');
    toast('DXF gerado: coordenadas UTM em metros, com os lotes vizinhos.', 5000);
  }
  toast('Montando o DXF…', 8000);
  wfs('sefaz:lotes', 'DWITHIN(geom, ' + pontoWkt() + ', ' + Math.round(lote.raio + 60) + ', meters)', 'cod_lote,geom', 250)
    .then(function(j){ monta(j.features || []); }, function(){ monta([]); });
}

function listar(itens, titulo, quieto){ /* itens com {grupo:'...'} viram cabeçalhos */

  if (!n){ el.hidden = true; if (!quieto) toast('Nada encontrado para essa busca.'); return; }

  $('rfecha').addEventListener('click', function(){ el.hidden = true; });

}
function itensDeImoveis(feats){
  var visto = {}, out = [];
  feats.forEach(function(f){
    var p = f.properties; if (!p || visto[p.codelote]) return; visto[p.codelote] = 1;
    out.push({ rua:String(p.ruaimo || ''), nro:parseInt(p.nrporta, 10) || 0,
      t:endereco(p) + (p.nomebairro ? ' — ' + p.nomebairro : ''),
      s:'Lote ' + p.codelote + (p.parcelamen ? ' · ' + p.parcelamen : '') + (semZeros(p.quadra) ? ' · Qd ' + semZeros(p.quadra) : '') + (semZeros(p.lote) ? ' · Lt ' + semZeros(p.lote) : ''),
      fn:function(){ selecionarCodigo(p.codelote); } });
  });
  out.sort(function(a, b){ return a.rua < b.rua ? -1 : a.rua > b.rua ? 1 : a.nro - b.nro; });
  return out;
}
function buscaLote(cod){
  toast('Buscando lote…', 8000);
  wfs('sefaz:lotes', "cod_lote LIKE '" + cod + "%'", 'cod_lote', 60).then(function(j){
    $('toast').hidden = true;
    if (j.features.length === 1){ $('results').hidden = true; selecionarCodigo(j.features[0].properties.cod_lote); return; }
    listar(j.features.map(function(f){ var c = f.properties.cod_lote; return { t:'Lote ' + c, s:'clique para localizar', fn:function(){ selecionarCodigo(c); } }; }), j.features.length + ' lote(s) começando com ' + cod);
  }).catch(erro);
}
function buscaInscricao(ins){
  var fmt = ins.slice(0, 4) + '.' + ins.slice(4, 7) + '.' + ins.slice(7, 10) + '-' + ins.slice(10);
  if (ins.charAt(4) !== '0'){ buscaLote(ins); return; }
  var pre = ins.slice(0, 4) + ins.slice(5, 7);
  toast('Buscando a quadra da inscrição ' + fmt + '…', 9000);
  Promise.all([
    wfs('sefaz:imoveis_areas', "codelote LIKE '" + pre + "%'", PROPS_IMO, 2000),
    wfs('sefaz:lotes', "cod_lote LIKE '" + pre + "%'", 'cod_lote,geom', 500).catch(vazio)
  ]).then(function(r){
    $('toast').hidden = true;
    var it = itensDeImoveis(r[0].features);
    if (!it.length){ buscaLote(ins); return; }
    quadraG.clearLayers();
    if (r[1].features.length){
      var g = L.geoJSON(r[1], AMARELO).addTo(quadraG);
      map.fitBounds(g.getBounds(), { padding:[60,60], maxZoom:19 });
      ligarCamada('sefaz:lotes');
    }
    if (it.length === 1){ $('results').hidden = true; it[0].fn(); return; }
    listar(it.slice(0, 200), 'Inscrição ' + fmt + ': pela inscrição só dá para chegar à quadra fiscal (' + it.length + ' lotes). Escolha pelo endereço.');
  }).catch(erro);
}
function buscaNomes(txt){
  return Promise.all([
    wfs('sefaz:bairros', "nome ILIKE '%" + aspas(txt) + "%'", 'nome', 8).catch(vazio),
    wfs('sefaz:parcelamentos', "nome ILIKE '%" + aspas(txt) + "%'", 'nome', 25).catch(vazio)
  ]).then(function(r){
    var it = [];
    r[0].features.forEach(function(f){ it.push({ t:'Bairro ' + f.properties.nome, s:'clique para ir até o bairro', fn:function(){ irParaArea('sefaz:bairros', null, 'sefaz:bairros', 'o bairro', '&featureID=' + encodeURIComponent(f.id)); } }); });
    r[1].features.forEach(function(f){ it.push({ t:'Parcelamento ' + f.properties.nome, s:'clique para ir até o parcelamento', fn:function(){ irParaArea('sefaz:parcelamentos', null, 'sefaz:parcelamentos', 'o parcelamento', '&featureID=' + encodeURIComponent(f.id)); } }); });
    return it;
  });
}
/* ---- lugares pelo nome (igreja, faculdade, comércio...) e endereços aproximados: serviço de busca da Esri ---- */
var GEO = 'https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/';
var GEO_AREA = [LIMITE[0][1], LIMITE[0][0], LIMITE[1][1], LIMITE[1][0]].join(',');
var GEO_ONDE = '&countryCode=BRA&location=' + INICIO.c[1] + ',' + INICIO.c[0] + '&searchExtent=' + GEO_AREA;
var buscaSeq = 0, sugT = null;
function sugereLugares(txt, max){
  return fetch(GEO + 'suggest?f=json&maxSuggestions=' + (max || 6) + '&text=' + encodeURIComponent(txt) + GEO_ONDE)
    .then(function(r){ return r.json(); }).then(function(j){ return j.suggestions || []; });
}
function itensDeLugares(sug){
  return sug.map(function(g){
    var p = String(g.text).split(', '), resto = p.slice(1).filter(function(x){ return !/^(Campo Grande|Mato Grosso do Sul|BRA|\d{5}(-\d{3})?)$/i.test(x); }).join(', ');
    return { t:p[0], s:resto || 'Campo Grande', fn:function(){ irParaLugar(g); } };
  });
}
function irParaLugar(g){
  var nome = String(g.text).split(', ')[0];
  toast('Localizando ' + nome + '…', 9000);
  fetch(GEO + 'findAddressCandidates?f=json&outSR=4326&maxLocations=10&outFields=PlaceName,Place_addr&SingleLine=' + encodeURIComponent(g.text) + '&magicKey=' + encodeURIComponent(g.magicKey || '') + GEO_ONDE)
    .then(function(r){ return r.json(); }).then(function(j){
      var c = j.candidates || [];
      if (!c.length) throw new Error('sem candidatos');
      $('toast').hidden = true;
      if (c.length === 1 || !g.isCollection){ $('results').hidden = true; irParaPonto(c[0].location.y, c[0].location.x, nome); return; }
      listar(c.map(function(x){
        var a = x.attributes || {};
        return { t:a.PlaceName || x.address, s:a.Place_addr || '', fn:function(){ $('results').hidden = true; irParaPonto(x.location.y, x.location.x, a.PlaceName || x.address); } };
      }), c.length + ' lugares com esse nome');
    }).catch(function(){ /* reserva: Photon, com dados do OpenStreetMap */
      fetch('https://photon.komoot.io/api/?limit=1&q=' + encodeURIComponent(g.text) + '&lat=' + INICIO.c[0] + '&lon=' + INICIO.c[1] + '&bbox=' + GEO_AREA)
        .then(function(r){ return r.json(); }).then(function(j){
          var f = (j.features || [])[0];
          if (!f){ toast('Não encontrei a posição deste lugar.'); return; }
          $('toast').hidden = true; $('results').hidden = true;
          irParaPonto(f.geometry.coordinates[1], f.geometry.coordinates[0], nome);
        }).catch(function(){ toast('Não consegui consultar o serviço de lugares agora.'); });
    });
}
function buscaTexto(q){
  var bruto = semAcento(q), txt = bruto, nro = null, mm = txt.match(/^(.*?)[,\s]+(\d+[A-Z]?)$/);
  if (mm){ txt = mm[1].trim(); nro = mm[2]; }
  txt = txt.replace(/^(RUA|R\.|R|AVENIDA|AV\.|AV|TRAVESSA|TV\.|TV|ALAMEDA|AL\.|RODOVIA|ROD\.|ESTRADA)\s+/, '').replace(/,$/, '').trim();
  if (bruto.length < 3){ toast('Digite pelo menos 3 letras.'); return; }
  var seq = ++buscaSeq;
  toast('Buscando…', 9000);
  Promise.all([
    txt.length >= 3 ? wfs('sefaz:imoveis_areas', "ruaimo ILIKE '%" + aspas(txt) + "%'" + (nro ? " AND nrporta='" + aspas(nro) + "'" : ''), PROPS_IMO, 400).then(function(j){ return itensDeImoveis(j.features); }, nulo) : Promise.resolve([]),
    nro ? Promise.resolve([]) : buscaNomes(bruto).catch(function(){ return []; }),
    sugereLugares(q, 6).then(itensDeLugares, function(){ return []; })
  ]).then(function(r){
    if (seq !== buscaSeq) return;
    $('toast').hidden = true;
    var cad = r[0] || [], nomes = r[1], lug = r[2], itens = [];
    if (cad.length === 1 && !nomes.length && (nro || !lug.length)){ $('results').hidden = true; cad[0].fn(); return; }
    if (cad.length){ itens.push({ grupo:'Endereços no cadastro da Prefeitura' + (cad.length > 40 ? ' (40 de ' + cad.length + ')' : '') }); itens = itens.concat(cad.slice(0, 40)); }
    if (nomes.length){ itens.push({ grupo:'Bairros e parcelamentos' }); itens = itens.concat(nomes); }
    if (lug.length){ itens.push({ grupo:'Lugares e endereços (busca da Esri)' }); itens = itens.concat(lug); }
    if (r[0] === null && !itens.length){ erro(new Error('cadastro indisponível')); return; }
    listar(itens, 'Resultados para "' + q + '"' + (cad.length > 1 && !nro ? ' — informe o número para refinar' : ''));
  });
}
function irParaPonto(lat, lon, rotulo){
  var ll = L.latLng(lat, lon);
  quadraG.clearLayers();
  var mk = L.circleMarker(ll, { radius:7, pane:'sel', interactive:false, pmIgnore:true, color:'#fff', weight:2, fillColor:DESTAQUE, fillOpacity:1 }).addTo(quadraG);
  if (rotulo) mk.bindTooltip(h(rotulo), { permanent:true, direction:'top', offset:[0, -8] });
  ligarCamada('sefaz:lotes');
  map.setView(ll, 19);
  identificar(ll, rotulo ? 'Lugar localizado. Clique no lote desejado para abrir a ficha.' : null);
}
function buscar(q){
  q = String(q || '').trim(); if (!q) return;
  clearTimeout(sugT); buscaSeq++;
  $('results').hidden = true;
  var co = q.match(/^(-?\d{1,2}[.,]\d+)\s*[,; ]\s*(-?\d{1,2}[.,]\d+)$/);
  if (co){
    var a = parseFloat(co[1].replace(',', '.')), b = parseFloat(co[2].replace(',', '.')), lat = a, lon = b;
    if (a < -40){ lat = b; lon = a; }
    if (lat < -22 || lat > -19 || lon < -56 || lon > -53){ toast('Essas coordenadas ficam fora da região de Campo Grande.'); return; }
    irParaPonto(lat, lon); return;
  }
  var dig = q.replace(/[.\-\/\s]/g, '');
  if (/^\d{6,}$/.test(dig)){ if (dig.length === 11) buscaInscricao(dig); else buscaLote(dig.slice(0, 12)); return; }
  buscaTexto(q);
}
$('fbusca').addEventListener('submit', function(e){ e.preventDefault(); buscar($('q').value); });
$('q').addEventListener('input', function(){ /* sugestões enquanto digita (só para texto; códigos e coordenadas não saem daqui) */
  var v = this.value.trim();
  clearTimeout(sugT);
  if (v.length < 3 || /^[\d.,;\-\/\s]+$/.test(v)) return;
  sugT = setTimeout(function(){
    var seq = ++buscaSeq;
    sugereLugares(v, 6).then(function(g){
      if (seq !== buscaSeq || $('q').value.trim() !== v || !g.length) return;
      listar([{ grupo:'Sugestões de lugares e endereços (busca da Esri)' }].concat(itensDeLugares(g)), 'Enter busca também no cadastro da Prefeitura', true);
    }).catch(function(){});
  }, 400);
});

var parcCarregado = false;
$('bql').addEventListener('click', function(){

$('fql').addEventListener('submit', function(e){
  e.preventDefault();
  var parc = semAcento($('qparc').value), qd = semZeros($('qquadra').value.trim()), lt = semZeros($('qlote').value.trim());
  function roda(cqlParc){
    var cql = cqlParc;
    if (qd) cql += " AND quadra LIKE '%" + aspas(qd) + "'";
    if (lt) cql += " AND lote LIKE '%" + aspas(lt) + "'";
    return wfs('sefaz:imoveis_areas', cql, PROPS_IMO, 800).then(function(j){
      $('toast').hidden = true;
      var it = itensDeImoveis(j.features.filter(function(f){ return (!qd || semZeros(f.properties.quadra) === qd) && (!lt || semZeros(f.properties.lote) === lt); }));
      if (it.length === 1){ $('results').hidden = true; it[0].fn(); return; }
      listar(it.slice(0, 150), it.length + ' lote(s) encontrados');
    });
  }
  if (/^\d+$/.test(parc)){
    toast('Buscando o parcelamento de código ' + parc + '…', 9000);
    wfs('sefaz:lotes', 'codigo_parcelamento_oficial=' + Number(parc), 'cod_lote', 8).then(function(j){
      var cods = props(j).map(function(p){ return "'" + aspas(p.cod_lote) + "'"; });
      if (!cods.length){ toast('Não encontrei parcelamento com o código ' + parc + '.'); return; }
      return wfs('sefaz:imoveis_areas', 'codelote IN (' + cods.join(',') + ')', 'parcelamen', 8).then(function(k){
        var nome = '';
        props(k).forEach(function(p){ if (!nome && p.parcelamen) nome = p.parcelamen; });
        if (!nome){ toast('Não consegui descobrir o nome do parcelamento de código ' + parc + '.'); return; }
        $('qparc').value = nome;
        return roda("parcelamen ILIKE '" + aspas(nome) + "'");
      });
    }).catch(erro);
    return;
  }

      if (lote && y + px(5.4) <= limite){
        ctx.fillStyle = DESTAQUE_FUNDO; ctx.fillRect(colX, y + px(0.6), px(5), px(3.2)); ctx.lineWidth = px(0.5); ctx.strokeStyle = DESTAQUE; ctx.strokeRect(colX, y + px(0.6), px(5), px(3.2));
        fonte(8.5, false); ctx.fillStyle = pal.tinta; ctx.fillText('Imóvel consultado', colX + px(7), y + px(3.4)); y += px(5.4);
      }
      legs.forEach(function(g){
        var f = Math.min(1, colW / g.im.width), hh = g.im.height * f, tl = CAM[g.n] ? CAM[g.n].t : g.n.replace('sefaz:', '');
        if (y + pt(8) * 1.3 + Math.min(hh, px(12)) > limite) return;
        escreve(tl, 8, true, pal.tinta, 0.2);
        var cabe = Math.min(hh, limite - y), f2 = cabe / g.im.height;
        if (cabe < hh) f = f2;
        ctx.drawImage(g.im, colX, y, g.im.width * f, g.im.height * f); y += g.im.height * f + px(1.2);
      });
    }
    if (obs && secao('Observações')) escreve(obs, 8.5, false, null, 0, true);
    /* rodapé fixo */
    y = fim - px(25); limite = fim;
    ctx.fillStyle = pal.linha; ctx.fillRect(colX, y, colW, px(0.3)); y += px(1.2);
    escreve('Escala 1:' + Number(Math.round(esc)).toLocaleString('pt-BR') + ' (folha ' + (A3 ? 'A3' : 'A4') + ')', 10, true);
    escreve('Emitido em ' + agora(), 8, false, pal.suave, 0.8);
    escreve('Fonte dos dados e imagens: GeoCG / Prefeitura Municipal de Campo Grande-MS. Planta gerada em ferramenta interna da Chaos Arq & Art; não é documento oficial e o desenho cadastral não substitui levantamento topográfico.', 6.5, false, pal.suave);

    canvas.toBlob(function(blob){
      if (!blob){ fimPlanta('Não consegui montar o arquivo da planta.'); return; }
      blob.arrayBuffer().then(function(buf){
        var pdf = pdfDeJpeg(new Uint8Array(buf), canvas.width, canvas.height, PW / 25.4 * 72, PH / 25.4 * 72);
        ultimaPlanta = { nome:nome, blob:pdf };
        baixarBlob(nome, pdf);
        fimPlanta(null);
        barra('Planta pronta. O arquivo "' + nome + '" foi para a sua pasta Downloads.', true);
      }, function(){ fimPlanta('Não consegui montar o arquivo da planta.'); });
    }, 'image/jpeg', 0.9);
  }).catch(function(e){ if (window.console) console.error(e); fimPlanta('Não consegui gerar a planta agora: o servidor de mapas não respondeu. Tente de novo em instantes.'); });
}

map.on('click', function(e){
  if (med.on){ med.pts.push(e.latlng); medDesenha(); return; }
  if (pmAtivo() || Date.now() - desUlt < 500) return;
  if (ent.pegando){ ent.pegando = false; map.getContainer().style.cursor = ''; entRodar(e.latlng); return; }
  var temInfo = infoCamadas(e.latlng);
  if (map.getZoom() < 16){ if (!temInfo) toast('Aproxime mais o mapa para selecionar um lote.'); return; }
  identificar(e.latlng);
});
document.addEventListener('keydown', function(e){
  var tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
  if (e.key === 'Escape'){
    if (med.on) medLiga(false);
    if (map.pm) map.pm.disableDraw();
    if (ent.pegando){ ent.pegando = false; map.getContainer().style.cursor = ''; }
  } else if (e.key === 'Backspace' && med.on && med.pts.length){
    med.pts.pop(); medDesenha(); e.preventDefault();
  }
});
$('tup').addEventListener('click', function(){ $('fup').click(); });
$('fup').addEventListener('change', function(){
  var arq = this.files[0]; if (!arq) return;
  var rd = new FileReader();
  rd.onload = function(){
    try {
      var gj;
      if (/\.kml$/i.test(arq.name)){
        if (!window.toGeoJSON) throw new Error('leitor de KML indisponível');
        gj = window.toGeoJSON.kml(new DOMParser().parseFromString(rd.result, 'text/xml'));
      } else gj = JSON.parse(rd.result);
      var l = L.geoJSON(gj, { pane:'sel', pmIgnore:true, style:{ color:'#1e88e5', weight:2, fillOpacity:0.1 },
        pointToLayer:function(ft, p){ return L.circleMarker(p, { pane:'sel', pmIgnore:true, radius:6, color:'#1e88e5' }); },
        onEachFeature:function(ft, ly){ var n = ft.properties && (ft.properties.name || ft.properties.nome); if (n) ly.bindTooltip(h(n)); } }).addTo(impG);
      map.fitBounds(l.getBounds(), { maxZoom:19, padding:[40,40] });
      toast('Arquivo importado: ' + arq.name);
    } catch (e) { toast('Não consegui ler este arquivo (use KML ou GeoJSON).', 5000); }
  };
  rd.readAsText(arq);
  this.value = '';
});
$('tlimpar').addEventListener('click', function(){
  selG.clearLayers(); impG.clearLayers(); quadraG.clearLayers(); locG.clearLayers();
  if (med.on) medLiga(false);
  med.pts = []; medDesenha(); entLimpa(); map.closePopup();
  atual = null; mostraFicha(false); $('results').hidden = true;
  try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
});
